services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - "./mosquitto/config:/mosquitto/config"
      - "./mosquitto/data:/mosquitto/data"
      - "./mosquitto/log:/mosquitto/log"
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - "./influxdb/data:/var/lib/influxdb2"
      - "./influxdb/config:/etc/influxdb2"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: "setup"
      DOCKER_INFLUXDB_INIT_USERNAME: "${INFLUX_USERNAME:-water_admin}"
      DOCKER_INFLUXDB_INIT_PASSWORD: "${INFLUX_PASSWORD:-change_me}"
      DOCKER_INFLUXDB_INIT_ORG: "${INFLUX_ORG:-water-monitoring}"
      DOCKER_INFLUXDB_INIT_BUCKET: "${INFLUX_BUCKET:-water-data}"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "${INFLUX_TOKEN:-change_me}"
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-water_app}"
      POSTGRES_USER: "${POSTGRES_USER:-water_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change_me}"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: water-backend
    ports:
      - "8000:8000"
    environment:
      MQTT_HOST: "mosquitto"
      MQTT_PORT: "1883"
      INFLUX_URL: "http://influxdb:8086"
      INFLUX_ORG: "${INFLUX_ORG:-water-monitoring}"
      INFLUX_BUCKET: "${INFLUX_BUCKET:-water-data}"
      INFLUX_TOKEN: "${INFLUX_TOKEN:-change_me}"
      INFLUX_MEASUREMENT: "${INFLUX_MEASUREMENT:-water_telemetry}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-change_me_use_a_long_random_value}"
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://water_user:change_me@postgres:5432/water_app}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
    depends_on:
      - influxdb
      - postgres
    restart: unless-stopped

  water-ingestor:
    build:
      context: ./backend
    container_name: water-ingestor
    depends_on:
      - influxdb
      - mosquitto
    environment:
      PYTHONUNBUFFERED: "1"
      MQTT_HOST: "${MQTT_HOST:-mosquitto}"
      MQTT_PORT: "1883"
      MQTT_TOPIC_FILTER: "${MQTT_TOPIC_FILTER:-water/flow/+/+/telemetry}"
      MQTT_QOS: "${MQTT_QOS:-1}"
      INFLUX_URL: "http://influxdb:8086"
      INFLUX_ORG: "${INFLUX_ORG:-water-monitoring}"
      INFLUX_BUCKET: "${INFLUX_BUCKET:-water-data}"
      INFLUX_TOKEN: "${INFLUX_TOKEN:-change_me}"
      INFLUX_MEASUREMENT: "${INFLUX_MEASUREMENT:-water_telemetry}"
      INFLUX_BATCH_SIZE: "500"
      INFLUX_FLUSH_INTERVAL_MS: "1000"
      INFLUX_JITTER_INTERVAL_MS: "500"
      INFLUX_RETRY_INTERVAL_MS: "2000"
      INGEST_QUEUE_MAX: "20000"
    command: ["python", "-m", "app.workers.ingestor.main"]
    restart: unless-stopped

  water-simulator:
    build:
      context: ./backend
    container_name: water-simulator
    depends_on:
      - mosquitto
    environment:
      PYTHONUNBUFFERED: "1"
      MQTT_HOST: "${MQTT_HOST:-mosquitto}"
      MQTT_PORT: "1883"
      SITE: "${SITE:-indatta}"
      INTERVAL_SEC: "${INTERVAL_SEC:-10}"
      SIM_DEVICES_JSON: '[{"device_id":"floor1-python","floor":"P1","tenant":"python","meter_role":"submeter"},{"device_id":"floor3-python","floor":"P3","tenant":"python","meter_role":"submeter"}]'
    command: ["python", "app/workers/sim_flow_sensors.py"]
    restart: unless-stopped

volumes:
  pgdata:
